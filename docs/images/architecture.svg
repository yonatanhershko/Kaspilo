<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A7C6F"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9804F"/>
    </marker>
    <style>
      .h1 { font-size: 26px; font-weight: 700; fill: #2E3D38; }
      .sub { font-size: 14px; fill: #485751; }
      .group { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .groupsub { font-size: 12.5px; fill: #E6F0E9; }
      .title { font-size: 15px; font-weight: 600; fill: #2E3D38; }
      .body { font-size: 12.5px; fill: #485751; }
      .edge { font-size: 12px; font-weight: 600; fill: #4A7C6F; }
      .edge-accent { font-size: 12px; font-weight: 600; fill: #A8622F; }
      .card { fill: #FFFFFF; stroke: #E4DFD2; stroke-width: 1.5; }
      .tag { font-size: 10.5px; font-weight: 700; fill: #A8622F; letter-spacing: 0.6px; }
    </style>
  </defs>

  <rect width="1280" height="780" rx="24" fill="#F5F1E8"/>

  <text x="40" y="54" class="h1">Kaspilo · architecture</text>
  <text x="40" y="78" class="sub">One Supabase database behind the mobile app and the admin dashboard. Row Level Security on every table.</text>

  <!-- ============ Mobile app ============ -->
  <rect x="40" y="104" width="390" height="390" rx="18" fill="#E6F0E9" stroke="#A8C5B4" stroke-width="1.5"/>
  <rect x="40" y="104" width="390" height="56" rx="18" fill="#4A7C6F"/>
  <rect x="40" y="140" width="390" height="20" fill="#4A7C6F"/>
  <text x="62" y="130" class="group">Mobile app</text>
  <text x="62" y="149" class="groupsub">Expo · React Native · TypeScript · iOS + Android</text>

  <rect x="58" y="174" width="354" height="56" rx="12" class="card"/>
  <text x="74" y="197" class="title">Screens</text>
  <text x="74" y="217" class="body">Expo Router · NativeWind · Hebrew (RTL) + English</text>

  <rect x="58" y="240" width="354" height="56" rx="12" class="card"/>
  <text x="74" y="263" class="title">React Query cache</text>
  <text x="74" y="283" class="body">Server data cached in memory, refetch on focus / pull</text>

  <rect x="58" y="306" width="354" height="56" rx="12" class="card"/>
  <text x="74" y="329" class="title">Local storage (AsyncStorage)</text>
  <text x="74" y="349" class="body">Auth session, theme, language</text>

  <rect x="58" y="372" width="354" height="50" rx="12" class="card"/>
  <text x="74" y="393" class="title">Offline cache + write queue</text>
  <text x="74" y="412" class="body">Persisted queries, adds synced when back online</text>

  <rect x="58" y="432" width="354" height="50" rx="12" class="card"/>
  <text x="74" y="453" class="title">Notifications</text>
  <text x="74" y="472" class="body">Daily "log your spending" + subscription expiry</text>

  <!-- ============ Admin dashboard ============ -->
  <rect x="40" y="530" width="390" height="190" rx="18" fill="#E6F0E9" stroke="#A8C5B4" stroke-width="1.5"/>
  <rect x="40" y="530" width="390" height="56" rx="18" fill="#4A7C6F"/>
  <rect x="40" y="566" width="390" height="20" fill="#4A7C6F"/>
  <text x="62" y="556" class="group">Admin dashboard</text>
  <text x="62" y="575" class="groupsub">Next.js · React · Tailwind · Vercel</text>

  <rect x="58" y="600" width="170" height="104" rx="12" class="card"/>
  <text x="74" y="624" class="title">Approvals</text>
  <text x="74" y="645" class="body">Confirm Bit payment,</text>
  <text x="74" y="663" class="body">open access for</text>
  <text x="74" y="681" class="body">one year</text>

  <rect x="242" y="600" width="170" height="104" rx="12" class="card"/>
  <text x="258" y="624" class="title">Users</text>
  <text x="258" y="645" class="body">Status, expiry,</text>
  <text x="258" y="663" class="body">renew, block,</text>
  <text x="258" y="681" class="body">history</text>

  <!-- ============ Middle column ============ -->
  <rect x="490" y="104" width="300" height="140" rx="18" class="card"/>
  <text x="510" y="134" class="title">Shared packages</text>
  <text x="510" y="160" class="body"><tspan font-weight="700" fill="#2E3D38">@kaspilo/shared</tspan> money math in integer</text>
  <text x="510" y="178" class="body">minor units, budget periods, types</text>
  <text x="510" y="204" class="body"><tspan font-weight="700" fill="#2E3D38">@kaspilo/tokens</tspan> one design system</text>
  <text x="510" y="222" class="body">for mobile + web (light / dark)</text>

  <rect x="490" y="388" width="300" height="96" rx="18" class="card"/>
  <text x="510" y="418" class="title">Expo Push Service</text>
  <text x="510" y="442" class="body">Delivers push to the phone</text>
  <text x="510" y="460" class="body">through APNs (iOS) / FCM (Android)</text>

  <!-- ============ Supabase ============ -->
  <rect x="850" y="104" width="390" height="616" rx="18" fill="#E6F0E9" stroke="#A8C5B4" stroke-width="1.5"/>
  <rect x="850" y="104" width="390" height="56" rx="18" fill="#2E3D38"/>
  <rect x="850" y="140" width="390" height="20" fill="#2E3D38"/>
  <text x="872" y="130" class="group">Supabase</text>
  <text x="872" y="149" class="groupsub">Backend · one project per environment (dev / prod)</text>

  <rect x="868" y="174" width="354" height="64" rx="12" class="card"/>
  <text x="884" y="198" class="title">Auth</text>
  <text x="884" y="219" class="body">Email + password, email OTP, password reset</text>

  <rect x="868" y="248" width="354" height="80" rx="12" class="card"/>
  <text x="884" y="272" class="title">API · PostgREST + RPC</text>
  <text x="884" y="293" class="body">category_totals, goal_totals</text>
  <text x="884" y="311" class="body">Admin RPCs check is_admin() first</text>

  <rect x="868" y="338" width="354" height="148" rx="12" class="card"/>
  <text x="884" y="362" class="title">PostgreSQL + Row Level Security</text>
  <text x="884" y="384" class="body">profiles · subscription_events</text>
  <text x="884" y="402" class="body">user_settings · categories · transactions</text>
  <text x="884" y="420" class="body">recurring_rules · goals · goal_deposits</text>
  <text x="884" y="446" class="body">Each user sees only their own rows.</text>
  <text x="884" y="464" class="body">Money tables also need has_access().</text>

  <rect x="868" y="496" width="354" height="100" rx="12" class="card"/>
  <text x="884" y="520" class="title">pg_cron · daily job</text>
  <text x="884" y="541" class="body">00:05 UTC: expired plans lose access</text>
  <text x="884" y="559" class="body">Plans 30 / 7 days from expiry</text>
  <text x="884" y="577" class="body">trigger reminder pushes</text>

  <rect x="868" y="606" width="354" height="96" rx="12" class="card"/>
  <text x="884" y="630" class="title">Edge Function · push sender</text>
  <text x="884" y="652" class="body">Sends reminders to Expo Push</text>
  <text x="884" y="670" class="body">with each device's push token</text>

  <!-- ============ Edges ============ -->
  <!-- mobile <-> API -->
  <line x1="430" y1="290" x2="866" y2="290" stroke="#4A7C6F" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="512" y="262" width="256" height="20" rx="10" fill="#F5F1E8"/>
  <text x="640" y="277" text-anchor="middle" class="edge">supabase-js · publishable key · RLS</text>

  <!-- mobile <-> Auth -->
  <path d="M820,290 V206 H866" fill="none" stroke="#4A7C6F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="812" y="257" text-anchor="end" class="edge">sign in / OTP</text>

  <!-- shared -> mobile -->
  <line x1="490" y1="174" x2="432" y2="174" stroke="#A8C5B4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- admin -> API (admin RPCs) -->
  <path d="M430,580 H830 V312 H866" fill="none" stroke="#4A7C6F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="540" y="567" width="200" height="20" rx="10" fill="#F5F1E8"/>
  <text x="640" y="582" text-anchor="middle" class="edge">admin RPCs (is_admin)</text>

  <!-- cron -> edge function -->
  <line x1="1045" y1="596" x2="1045" y2="604" stroke="#4A7C6F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- edge function -> expo push -->
  <path d="M868,650 H818 V436 H792" fill="none" stroke="#C9804F" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- expo push -> phone notifications -->
  <path d="M490,456 H452 V457 H414" fill="none" stroke="#C9804F" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="460" y="446" text-anchor="middle" class="edge-accent">push</text>

  <!-- ============ Legend ============ -->
  <text x="1240" y="757" text-anchor="end" class="body">Money is stored as integers (agorot / cents). Never floats.</text>
</svg>
