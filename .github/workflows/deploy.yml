# Production releases (docs/ci-cd.md). Never automatic: started by hand from the
# Actions tab on `main`, and every job waits in the "production" environment for the
# owner's approval before it touches prod.
name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      what:
        description: What to release
        type: choice
        options:
          - migrations
          - store build
          - migrations + store build
          - update (JS only, no store review)
        default: migrations
      platform:
        description: Store build platform
        type: choice
        options: [all, ios, android]
        default: all
      message:
        description: Update message (for "update")
        type: string
        default: ''
      confirm:
        description: Type "prod" to confirm
        type: string
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Check request
    runs-on: ubuntu-latest
    steps:
      - name: Only from main, only when confirmed
        env:
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then echo "Run this from main."; exit 1; fi
          if [ "$CONFIRM" != "prod" ]; then echo 'Type "prod" to confirm.'; exit 1; fi

  # The full CI is not run again here: it already ran on this exact commit when it was
  # pushed to main. This job only checks that the run passed (and waits if it is still
  # going), so the deploy saves about 8 minutes without skipping any check.
  tested:
    name: CI passed on this commit
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Find a passing CI run (push or by hand) on this commit
        run: |
          # Up to 20 minutes: a deploy started right after a merge waits for its CI.
          for i in $(seq 1 60); do
            # A GitHub API hiccup (502) is not a CI result: wait and ask again.
            if ! runs=$(gh run list --workflow ci.yml --commit "$SHA" --limit 50 \
              --json status,conclusion,event,url \
              --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")]'); then
              runs='[]'; echo "GitHub API error, asking again..."; sleep 20; continue
            fi
            if echo "$runs" | jq -e 'any(.[]; .conclusion == "success")' > /dev/null; then
              echo "CI passed on $SHA:"; echo "$runs" | jq -r '.[] | select(.conclusion == "success") | .url'
              exit 0
            fi
            if echo "$runs" | jq -e 'any(.[]; .status != "completed")' > /dev/null; then
              echo "CI is still running on this commit, waiting..."; sleep 20; continue
            fi
            # A push from a few seconds ago may not have its run listed yet.
            if [ "$i" -le 6 ] && echo "$runs" | jq -e 'length == 0' > /dev/null; then
              echo "No CI run listed yet, waiting..."; sleep 20; continue
            fi
            break
          done
          echo "No passing CI run on $SHA."
          echo "$runs" | jq -r '.[] | "\(.status) \(.conclusion // "-") \(.url)"'
          echo "Fix CI on main, or run it by hand (Actions -> CI -> Run workflow -> main), then deploy again."
          exit 1

  # The checks whose answer can change on the same code: a secret pattern added to the
  # scanner, a vulnerability published since the merge, the state of dev's advisors.
  fresh:
    name: Checks that can change with time
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      fresh_only: true
    secrets: inherit

  migrations:
    name: Prod migrations + Edge Functions
    needs: [tested, fresh]
    if: inputs.what == 'migrations' || inputs.what == 'migrations + store build'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
      PROD_PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      # Pinned: a new CLI release must never change how prod is migrated by surprise.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: test -f supabase/config.toml || supabase init
      - name: Show what will run
        run: supabase db push --db-url "$PROD_DB_URL" --dry-run
      # --yes: the CLI asks before applying and a CI run has no terminal to answer.
      # The owner already approved this job in the production environment.
      - name: Apply, in file order
        run: supabase db push --db-url "$PROD_DB_URL" --yes
      # After the migrations: the functions call database functions they add.
      - name: Deploy Edge Functions (auth-password and revenuecat-webhook are public, so no JWT check; the others need a session)
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROD_PROJECT_REF" ]; then
            echo "Missing PROD_SUPABASE_ACCESS_TOKEN (secret) or PROD_PROJECT_REF (variable): see docs/ci-cd.md"; exit 1
          fi
          supabase functions deploy auth-password --project-ref "$PROD_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy apple-revoke --project-ref "$PROD_PROJECT_REF" --yes
          supabase functions deploy revenuecat-webhook --project-ref "$PROD_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy revenuecat-sync --project-ref "$PROD_PROJECT_REF" --yes

  store-build:
    name: EAS store build
    needs: [tested, fresh, migrations]
    # Runs after migrations when both were asked for; also when migrations were skipped.
    if: >-
      always() && needs.tested.result == 'success' && needs.fresh.result == 'success' &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') &&
      (inputs.what == 'store build' || inputs.what == 'migrations + store build')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Start the build on EAS (it runs in Expo's cloud; follow it on expo.dev)
        working-directory: apps/mobile
        env:
          PLATFORM: ${{ inputs.platform }}
        # iPhone builds go on to TestFlight by themselves. Android is only built until the
        # Play Console app exists (docs/ci-cd.md), so it is not submitted.
        run: |
          # "all" builds both: iOS goes to TestFlight on its own, Android stays a download.
          if [ "$PLATFORM" != "android" ]; then
            eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
          fi
          if [ "$PLATFORM" != "ios" ]; then
            eas build --platform android --profile production --non-interactive --no-wait
          fi

  update:
    name: EAS Update (production channel)
    needs: [tested, fresh]
    if: inputs.what == 'update (JS only, no store review)'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # `eas update` does not read the build profile's env from eas.json, so APP_VARIANT is set
      # here. Without it app.config.ts falls back to the dev variant, and the update ships dev
      # values (scheme, Google iOS client) to the prod app: native Google sign-in then crashes.
      - name: Check the update gets the prod app config
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
        run: |
          # The same EAS production variables `eas update` will use (the file is gitignored).
          eas env:pull production --non-interactive --path .env.local
          npx expo config --type public --json > "$RUNNER_TEMP/config.json"
          jq -e '.ios.bundleIdentifier == "com.kaspilo.app" and .scheme == "kaspilo" and .extra.appVariant == "production"' "$RUNNER_TEMP/config.json" \
            || { echo "The update would ship a non-prod app config."; exit 1; }
          # Updates go only to builds with the same native fingerprint (app.config.ts
          # runtimeVersion), so one made with the Google iOS client never reaches a build without it.
          jq -e '.runtimeVersion.policy == "fingerprint"' "$RUNNER_TEMP/config.json" \
            || { echo "runtimeVersion must use the fingerprint policy, or an update could reach a build it crashes."; exit 1; }
      - name: Publish the update
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          MESSAGE: ${{ inputs.message }}
        run: eas update --channel production --environment production --message "${MESSAGE:-$(git log -1 --pretty=%s)}" --non-interactive
